services:
  postgres:
    image: postgres:16-alpine
    container_name: possing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-possing}
      POSTGRES_USER: ${POSTGRES_USER:-possing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-possing_secret}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - possing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-possing} -d ${POSTGRES_DB:-possing}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: possing-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-possing};Username=${POSTGRES_USER:-possing};Password=${POSTGRES_PASSWORD:-possing_secret}
      Jwt__Key: ${JWT_KEY:-PossingPosDevSecretKey_ChangeInProduction_Min32Chars!}
      Jwt__Issuer: Possing
      Jwt__Audience: PossingApp
      Cors__Origins__0: http://localhost:3000
      Cors__Origins__1: http://localhost:5173
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - possing_uploads:/app/wwwroot/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: possing-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  possing_pgdata:
  possing_uploads:
